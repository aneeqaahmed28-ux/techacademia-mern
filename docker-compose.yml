# Local demonstration stack. MongoDB has no auth and the JWT secret is a placeholder.
# Do not expose these ports on a public network.
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: ./server
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/techacademia
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-jwt-secret-change-me-now!!}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES_DAYS: 7
      CLIENT_ORIGIN: http://localhost:5173,http://localhost:8080
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      BCRYPT_SALT_ROUNDS: 10
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_AUTH_MAX: 10
      RATE_LIMIT_CONTACT_MAX: 20
      TRUST_PROXY: "1"
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo-data:
